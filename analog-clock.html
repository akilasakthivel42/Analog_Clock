<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Analog Clock</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #1e1e2e 0%, #10101a 100%);
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  .clock {
    position: relative;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: #16161f;
    box-shadow:
      0 0 0 8px #2a2a3a,
      0 0 40px rgba(0,0,0,0.6),
      inset 0 0 20px rgba(0,0,0,0.5);
  }

  .center-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 14px;
    height: 14px;
    background: #e0b23d;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    box-shadow: 0 0 8px rgba(224,178,61,0.8);
  }

  .hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom;
    border-radius: 10px;
  }

  .hour-hand {
    width: 8px;
    height: 80px;
    background: #eaeaea;
    margin-left: -4px;
  }

  .minute-hand {
    width: 5px;
    height: 115px;
    background: #eaeaea;
    margin-left: -2.5px;
  }

  .second-hand {
    width: 2px;
    height: 130px;
    background: #e0b23d;
    margin-left: -1px;
  }

  .marking {
    position: absolute;
    width: 100%;
    height: 100%;
  }

  .marking .tick {
    position: absolute;
    top: 0;
    left: 50%;
    width: 2px;
    height: 12px;
    background: #55556a;
    transform-origin: 1px 160px;
  }

  .marking .tick.major {
    width: 4px;
    height: 18px;
    background: #cfcfe0;
    margin-left: -1px;
  }

  .number {
    position: absolute;
    width: 100%;
    height: 100%;
    color: #cfcfe0;
    font-size: 22px;
    font-weight: 600;
  }

  .number span {
    position: absolute;
    transform: translate(-50%, -50%);
  }

  .digital {
    position: absolute;
    bottom: 78px;
    left: 50%;
    transform: translateX(-50%);
    color: #8a8aa0;
    font-size: 15px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<div class="clock" id="clock">
  <div class="marking" id="marking"></div>
  <div class="number" id="numbers"></div>
  <div class="hand hour-hand" id="hourHand"></div>
  <div class="hand minute-hand" id="minuteHand"></div>
  <div class="hand second-hand" id="secondHand"></div>
  <div class="center-dot"></div>
  <div class="digital" id="digital"></div>
</div>

<script>
  const marking = document.getElementById('marking');
  const numbers = document.getElementById('numbers');
  const radius = 160;

  for (let i = 0; i < 60; i++) {
    const tick = document.createElement('div');
    tick.className = 'tick' + (i % 5 === 0 ? ' major' : '');
    tick.style.transform = `rotate(${i * 6}deg)`;
    marking.appendChild(tick);
  }

  for (let n = 1; n <= 12; n++) {
    const angle = (n * 30 - 90) * (Math.PI / 180);
    const x = radius + Math.cos(angle) * (radius - 34);
    const y = radius + Math.sin(angle) * (radius - 34);
    const span = document.createElement('span');
    span.textContent = n;
    span.style.left = x + 'px';
    span.style.top = y + 'px';
    numbers.appendChild(span);
  }

  const hourHand = document.getElementById('hourHand');
  const minuteHand = document.getElementById('minuteHand');
  const secondHand = document.getElementById('secondHand');
  const digital = document.getElementById('digital');

  function updateClock() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();

    const hourDeg = ((h % 12) + m / 60) * 30;
    const minuteDeg = (m + s / 60) * 6;
    const secondDeg = s * 6;

    hourHand.style.transform = `rotate(${hourDeg}deg)`;
    minuteHand.style.transform = `rotate(${minuteDeg}deg)`;
    secondHand.style.transform = `rotate(${secondDeg}deg)`;

    const displayH = h % 12 === 0 ? 12 : h % 12;
    const ampm = h >= 12 ? 'PM' : 'AM';
    digital.textContent =
      `${String(displayH).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} ${ampm}`;
  }

  updateClock();
  setInterval(updateClock, 1000);
</script>

</body>
</html>
